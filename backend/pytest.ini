[pytest]
# Asyncio mode auto allows writing `async def test_*` without manual decorators on every test
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Set Python path so tests can import from `app`
pythonpath = .

# Test discovery pattern
testpaths = tests
python_files = test_*.py
python_functions = test_*

# Logging in test output
log_cli = false
log_level = INFO